[project]
name = "farmtrust"
version = "0.1.0"
description = "Satellite time-series pipeline for explainable land assessment signals"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "scipy>=1.13",
    "sqlmodel>=0.0.21",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
ingest-aoi = "scripts.ingest_aoi:main"

[project.optional-dependencies]
ml = [
    "scikit-learn",
    "xgboost",
    "joblib",
    "openpyxl",
    "xlrd",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "torchgeo==0.8.0",
    "torchmetrics==1.8.2",
    "lightgbm==4.6.0",
]
data = [
    "dask[array]>=2024.1.0",
    "odc-stac>=0.3.9",
    "planetary-computer>=1.0.0",
    "pyarrow>=23.0.1",
    "pyproj>=3.7.2",
    "pystac-client>=0.9.0",
    "python-dateutil>=2.9.0.post0",
    "rasterio>=1.5.0",
    "requests>=2.32.5",
    "rioxarray>=0.22.0",
    "shapely>=2.1.2",
    "xarray>=2026.2.0",
    "zarr>=2.18.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipython>=9.11.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "pip>=26.0.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["farmtrust_core*", "scripts*", "api*"]

[tool.fastapi]
entrypoint = "api.main:app"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Support for class-based `config` is deprecated.*:pydantic.warnings.PydanticDeprecatedSince20:planetary_computer.sas",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
agrovision-core = { workspace = true }

torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
